<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="A blob is split into data pieces, and parity pieces are computed one byte position at a time" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="720" height="350" fill="#ffffff"/>
  <text x="392" y="28" text-anchor="middle" fill="#111827">the byte at the same position in every piece</text>
  <!-- data pieces -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.25">
    <rect x="150" y="50" width="500" height="30" rx="4"/>
    <rect x="150" y="90" width="500" height="30" rx="4"/>
    <rect x="150" y="130" width="500" height="30" rx="4"/>
    <rect x="150" y="170" width="500" height="30" rx="4"/>
  </g>
  <!-- parity pieces -->
  <g fill="#fef3c7" stroke="#d97706" stroke-width="1.25">
    <rect x="150" y="225" width="500" height="30" rx="4"/>
    <rect x="150" y="265" width="500" height="30" rx="4"/>
  </g>
  <g fill="#111827" text-anchor="end">
    <text x="138" y="70">Data piece 1</text>
    <text x="138" y="110">Data piece 2</text>
    <text x="138" y="150">Data piece 3</text>
    <text x="138" y="190">Data piece 4</text>
    <text x="138" y="245">Parity piece 1</text>
    <text x="138" y="285">Parity piece 2</text>
  </g>
  <!-- the column for one byte position -->
  <rect x="380" y="40" width="24" height="264" fill="none" stroke="#111827" stroke-width="2" rx="4"/>
  <g fill="#2563eb">
    <rect x="384" y="54" width="16" height="22"/>
    <rect x="384" y="94" width="16" height="22"/>
    <rect x="384" y="134" width="16" height="22"/>
    <rect x="384" y="174" width="16" height="22"/>
  </g>
  <g fill="#d97706">
    <rect x="384" y="229" width="16" height="22"/>
    <rect x="384" y="269" width="16" height="22"/>
  </g>
  <text x="416" y="217" fill="#4b5563" font-size="12">4 data bytes in, 2 parity bytes out</text>
  <text x="400" y="330" text-anchor="middle" fill="#4b5563">The same small calculation is repeated for every byte position along the pieces.</text>
</svg>
