<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="With pieces 1 and 3 lost, the line through pieces 2 and 4 gives the lost values back" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="660" height="380" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="168" y1="30" x2="168" y2="310"/>
    <line x1="276" y1="30" x2="276" y2="310"/>
    <line x1="384" y1="30" x2="384" y2="310"/>
    <line x1="492" y1="30" x2="492" y2="310"/>
    <line x1="60" y1="226" x2="600" y2="226"/>
    <line x1="60" y1="170" x2="600" y2="170"/>
    <line x1="60" y1="114" x2="600" y2="114"/>
    <line x1="60" y1="58" x2="600" y2="58"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.25">
    <line x1="60" y1="310" x2="600" y2="310"/>
    <line x1="60" y1="30" x2="60" y2="310"/>
  </g>
  <g fill="#4b5563" text-anchor="middle">
    <text x="168" y="330">piece 1</text>
    <text x="276" y="330">piece 2</text>
    <text x="384" y="330">piece 3</text>
    <text x="492" y="330">piece 4</text>
  </g>
  <g fill="#4b5563" text-anchor="end">
    <text x="50" y="230">3</text>
    <text x="50" y="174">5</text>
    <text x="50" y="118">7</text>
    <text x="50" y="62">9</text>
  </g>
  <!-- the line redrawn through the two survivors -->
  <line x1="60" y1="282" x2="546" y2="30" stroke="#111827" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- lost points -->
  <g fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3">
    <circle cx="168" cy="226" r="8"/>
    <circle cx="384" cy="114" r="8"/>
  </g>
  <!-- surviving points -->
  <circle cx="276" cy="170" r="8" fill="#2563eb"/>
  <circle cx="492" cy="58" r="8" fill="#d97706"/>
  <g fill="#111827" font-weight="600">
    <text x="292" y="190">5</text>
    <text x="508" y="78">9</text>
  </g>
  <g fill="#dc2626">
    <text x="184" y="246">lost, read back from the line: 3</text>
    <text x="400" y="134">lost, read back from the line: 7</text>
  </g>
  <!-- key -->
  <circle cx="76" cy="358" r="6" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="90" y="362" fill="#111827">lost piece</text>
  <line x1="200" y1="358" x2="236" y2="358" stroke="#111827" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="246" y="362" fill="#111827">the only line through the two pieces that survived</text>
</svg>
