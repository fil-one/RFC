<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-label="A contiguous layout and an interleaved layout place the same blob differently across four data pieces" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="720" height="370" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" fill="#111827">The blob, in the order its bytes arrive</text>
  <!-- blob -->
  <g stroke-width="1.25">
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="120" y="38" width="60" height="30"/>
      <rect x="180" y="38" width="60" height="30"/>
      <rect x="240" y="38" width="60" height="30"/>
      <rect x="300" y="38" width="60" height="30"/>
    </g>
    <g fill="#d1fae5" stroke="#059669">
      <rect x="360" y="38" width="60" height="30"/>
      <rect x="420" y="38" width="60" height="30"/>
      <rect x="480" y="38" width="60" height="30"/>
      <rect x="540" y="38" width="60" height="30"/>
    </g>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="150" y="58">1</text><text x="210" y="58">2</text><text x="270" y="58">3</text><text x="330" y="58">4</text>
    <text x="390" y="58">5</text><text x="450" y="58">6</text><text x="510" y="58">7</text><text x="570" y="58">8</text>
  </g>

  <g font-size="12" text-anchor="middle">
    <text x="240" y="86" fill="#2563eb">arrives first</text>
    <text x="480" y="86" fill="#059669">arrives second</text>
  </g>

  <!-- contiguous -->
  <text x="210" y="126" text-anchor="middle" fill="#111827" font-weight="600">Contiguous layout</text>
  <g stroke-width="1.25">
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="150" y="150" width="60" height="30"/><rect x="210" y="150" width="60" height="30"/>
      <rect x="150" y="190" width="60" height="30"/><rect x="210" y="190" width="60" height="30"/>
    </g>
    <g fill="#d1fae5" stroke="#059669">
      <rect x="150" y="230" width="60" height="30"/><rect x="210" y="230" width="60" height="30"/>
      <rect x="150" y="270" width="60" height="30"/><rect x="210" y="270" width="60" height="30"/>
    </g>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="180" y="170">1</text><text x="240" y="170">2</text>
    <text x="180" y="210">3</text><text x="240" y="210">4</text>
    <text x="180" y="250">5</text><text x="240" y="250">6</text>
    <text x="180" y="290">7</text><text x="240" y="290">8</text>
  </g>
  <g fill="#111827" text-anchor="end">
    <text x="136" y="170">Piece 1</text><text x="136" y="210">Piece 2</text>
    <text x="136" y="250">Piece 3</text><text x="136" y="290">Piece 4</text>
  </g>
  <rect x="145" y="143" width="70" height="164" rx="4" fill="none" stroke="#111827" stroke-width="2"/>
  <g fill="#4b5563" font-size="12" text-anchor="middle">
    <text x="210" y="330">One parity calculation needs cells 1, 3, 5 and 7,</text>
    <text x="210" y="347">which arrive far apart</text>
  </g>

  <!-- striped -->
  <text x="540" y="126" text-anchor="middle" fill="#111827" font-weight="600">Interleaved layout</text>
  <g stroke-width="1.25">
    <g fill="#dbeafe" stroke="#2563eb">
      <rect x="480" y="150" width="60" height="30"/>
      <rect x="480" y="190" width="60" height="30"/>
      <rect x="480" y="230" width="60" height="30"/>
      <rect x="480" y="270" width="60" height="30"/>
    </g>
    <g fill="#d1fae5" stroke="#059669">
      <rect x="540" y="150" width="60" height="30"/>
      <rect x="540" y="190" width="60" height="30"/>
      <rect x="540" y="230" width="60" height="30"/>
      <rect x="540" y="270" width="60" height="30"/>
    </g>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="510" y="170">1</text><text x="570" y="170">5</text>
    <text x="510" y="210">2</text><text x="570" y="210">6</text>
    <text x="510" y="250">3</text><text x="570" y="250">7</text>
    <text x="510" y="290">4</text><text x="570" y="290">8</text>
  </g>
  <g fill="#111827" text-anchor="end">
    <text x="466" y="170">Piece 1</text><text x="466" y="210">Piece 2</text>
    <text x="466" y="250">Piece 3</text><text x="466" y="290">Piece 4</text>
  </g>
  <rect x="475" y="143" width="70" height="164" rx="4" fill="none" stroke="#111827" stroke-width="2"/>
  <g fill="#4b5563" font-size="12" text-anchor="middle">
    <text x="540" y="330">One parity calculation needs cells 1 to 4,</text>
    <text x="540" y="347">which arrive together</text>
  </g>
</svg>
