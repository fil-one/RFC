<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Three data values define a curve, and two more points on the curve are stored as parity" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="660" height="380" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="160" y1="30" x2="160" y2="310"/>
    <line x1="260" y1="30" x2="260" y2="310"/>
    <line x1="360" y1="30" x2="360" y2="310"/>
    <line x1="460" y1="30" x2="460" y2="310"/>
    <line x1="560" y1="30" x2="560" y2="310"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.25">
    <line x1="60" y1="310" x2="610" y2="310"/>
    <line x1="60" y1="30" x2="60" y2="310"/>
  </g>
  <g fill="#4b5563" text-anchor="middle">
    <text x="160" y="330">piece 1</text>
    <text x="260" y="330">piece 2</text>
    <text x="360" y="330">piece 3</text>
    <text x="460" y="330">piece 4</text>
    <text x="560" y="330">piece 5</text>
  </g>
  <!-- the curve y = x^2 - 2x + 3, drawn as an exact quadratic Bezier -->
  <path d="M110 278.5 Q340 310.7 570 46.7" fill="none" stroke="#111827" stroke-width="1.5"/>
  <g fill="#2563eb">
    <circle cx="160" cy="282" r="8"/>
    <circle cx="260" cy="268" r="8"/>
    <circle cx="360" cy="226" r="8"/>
  </g>
  <g fill="#d97706">
    <circle cx="460" cy="156" r="8"/>
    <circle cx="560" cy="58" r="8"/>
  </g>
  <g fill="#111827" font-weight="600" text-anchor="middle">
    <text x="160" y="264">2</text>
    <text x="260" y="250">3</text>
    <text x="350" y="208">6</text>
    <text x="442" y="148">11</text>
    <text x="540" y="54">18</text>
  </g>
  <circle cx="76" cy="358" r="6" fill="#2563eb"/>
  <text x="90" y="362" fill="#111827">3 data values fix the curve</text>
  <circle cx="330" cy="358" r="6" fill="#d97706"/>
  <text x="344" y="362" fill="#111827">2 parity values: any 3 of the 5 are enough</text>
</svg>
