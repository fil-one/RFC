<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Two data values define a line, and two more points on the line are stored as parity" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="660" height="380" fill="#ffffff"/>
  <!-- grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="168" y1="30" x2="168" y2="310"/>
    <line x1="276" y1="30" x2="276" y2="310"/>
    <line x1="384" y1="30" x2="384" y2="310"/>
    <line x1="492" y1="30" x2="492" y2="310"/>
    <line x1="60" y1="226" x2="600" y2="226"/>
    <line x1="60" y1="170" x2="600" y2="170"/>
    <line x1="60" y1="114" x2="600" y2="114"/>
    <line x1="60" y1="58" x2="600" y2="58"/>
  </g>
  <!-- axes -->
  <g stroke="#6b7280" stroke-width="1.25">
    <line x1="60" y1="310" x2="600" y2="310"/>
    <line x1="60" y1="30" x2="60" y2="310"/>
  </g>
  <g fill="#4b5563" text-anchor="middle">
    <text x="168" y="330">piece 1</text>
    <text x="276" y="330">piece 2</text>
    <text x="384" y="330">piece 3</text>
    <text x="492" y="330">piece 4</text>
  </g>
  <g fill="#4b5563" text-anchor="end">
    <text x="50" y="230">3</text>
    <text x="50" y="174">5</text>
    <text x="50" y="118">7</text>
    <text x="50" y="62">9</text>
  </g>
  <!-- the line y = 2x + 1 -->
  <line x1="60" y1="282" x2="546" y2="30" stroke="#111827" stroke-width="1.5"/>
  <!-- data points -->
  <g fill="#2563eb">
    <circle cx="168" cy="226" r="8"/>
    <circle cx="276" cy="170" r="8"/>
  </g>
  <!-- parity points -->
  <g fill="#d97706">
    <circle cx="384" cy="114" r="8"/>
    <circle cx="492" cy="58" r="8"/>
  </g>
  <g fill="#111827" font-weight="600">
    <text x="184" y="246">3</text>
    <text x="292" y="190">5</text>
    <text x="400" y="134">7</text>
    <text x="508" y="78">9</text>
  </g>
  <!-- key -->
  <circle cx="76" cy="358" r="6" fill="#2563eb"/>
  <text x="90" y="362" fill="#111827">data: the values we were given</text>
  <circle cx="330" cy="358" r="6" fill="#d97706"/>
  <text x="344" y="362" fill="#111827">parity: more points on the same line</text>
</svg>
